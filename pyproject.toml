[project]
name = "cinemind"
version = "0.2.0.dev0"
description = "Find, fetch and file movies and TV into a Plex-ready library, from public-domain archives or the Stremio addons you choose."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "httpx>=0.27",
    "tenacity>=9.2",
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "guessit>=3.8",
]

[project.optional-dependencies]
# BitTorrent downloads (Stremio stream addons). libtorrent has wheels for Windows, macOS and
# musl Linux (Alpine); without it, cinemind still does direct downloads.
torrent = ["libtorrent>=2.0.9"]

[project.scripts]
cinemind = "cinemind.cli.app:main"
sdl = "cinemind.cli.app:main"  # the stremio-dl command name, kept for one release

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinemind"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.5",
]
# The same as the "torrent" extra, as a group so `uv sync` installs it in a checkout. Leave it
# out with `uv sync --no-group torrent` where libtorrent has no wheel (glibc Linux).
torrent = ["libtorrent>=2.0.9"]

[tool.uv]
default-groups = ["dev", "torrent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: hits the live addon APIs (deselect with -m 'not network')",
    "torrent: runs local libtorrent sessions",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.coverage.run]
source = ["cinemind"]
branch = true

[tool.coverage.report]
# Ratchet: raise this as coverage grows (core modules are 86-96%; the interactive UI is not).
fail_under = 74
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", 'raise AssertionError\("unreachable"\)']
