name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  UV_PYTHON_PREFERENCE: only-system

jobs:
  # libtorrent publishes Windows, macOS and musl Linux wheels, but no glibc ones, so the Linux
  # jobs run in Alpine containers.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    steps:
      - name: Install system packages
        run: apk add --no-cache git
      - uses: actions/checkout@v7
      - name: Install uv
        run: python -m pip install --no-cache-dir --root-user-action=ignore "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run mypy

  test-linux:
    name: Test (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-alpine
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Install system packages
        run: apk add --no-cache git
      - uses: actions/checkout@v7
      - name: Install uv
        run: python -m pip install --no-cache-dir --root-user-action=ignore "uv==${UV_VERSION}"
      - run: uv sync --locked
      # Windows-only code (the shortcut, the Windows argument splitter) is not run here, so the
      # coverage gate in pyproject.toml is enforced by the Windows jobs; this one only reports it.
      - run: uv run pytest -m "not network" --cov --cov-report=term --cov-fail-under=0

  test-windows:
    name: Test (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_PREFERENCE: managed
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run pytest -m "not network" --cov --cov-report=term
      - name: Coverage summary
        if: matrix.python == '3.13'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
